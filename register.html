<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Cart-Verse</title>

<style>

/* ===== BACKGROUND ===== */
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1f2937 0%, #374151 35%, #f97316 100%);
    font-family: 'Segoe UI', sans-serif;
}

/* ===== CONTAINER ===== */
.auth-container {
    width: 420px;
    background: rgba(255, 255, 255, 0.96);
    padding: 30px 28px;
    border-radius: 18px;
    box-shadow: 0 26px 60px rgba(15, 23, 42, 0.25);
    animation: fadeIn 0.8s ease;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== HEADING ===== */
.auth-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #111827;
    font-size: 1.8rem;
}

/* ===== INPUT ===== */
.input-group {
    margin-bottom: 15px;
}

.input-group input,
.input-group select,
.input-group textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    background: #f9fafb;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
    border-color: #f97316;
    outline: none;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
}

/* ===== TWO COLUMN ===== */
.two-column {
    display: flex;
    gap: 10px;
}

/* ===== BUTTON ===== */
.auth-btn {
    width: 100%;
    padding: 13px 12px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff8a00, #ff5e00);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 12px 22px rgba(255, 94, 0, 0.2);
}

.auth-btn:hover {
    transform: translateY(-1px) scale(1.01);
    box-shadow: 0 14px 28px rgba(255, 94, 0, 0.26);
}

/* ===== FOOTER ===== */
.auth-footer {
    text-align: center;
    margin-top: 15px;
    color: #374151;
}

.auth-footer a {
    color: #ea580c;
    text-decoration: none;
    font-weight: 700;
}

.auth-footer a:hover {
    text-decoration: underline;
}

/* ===== RESPONSIVE ===== */
@media(max-width:450px){
    .auth-container {
        width: 90%;
    }

    .two-column {
        display: block;
    }
}

</style>
</head>

<body>

<div class="auth-container">
    <h2>Create Account</h2>

    <!-- NAME -->
    <div class="two-column">
        <div class="input-group">
            <input type="text" id="firstName" placeholder="First Name">
        </div>
        <div class="input-group">
            <input type="text" id="lastName" placeholder="Last Name">
        </div>
    </div>

    <!-- EMAIL -->
    <div class="input-group">
        <input type="email" id="email" placeholder="Enter Email">
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
        <input type="password" id="password" placeholder="Enter Password">
    </div>

    <!-- GENDER -->
    <div class="input-group">
        <select id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>

    <!-- ADDRESS -->
    <div class="input-group">
        <textarea id="address" rows="3" placeholder="Enter Address"></textarea>
    </div>

    <!-- SEND OTP -->
    <button class="auth-btn" onclick="sendOTP()">Send OTP</button>

    <!-- OTP -->
    <div class="input-group">
        <input type="text" id="otp" placeholder="Enter OTP">
    </div>

    <!-- REGISTER -->
    <button class="auth-btn" onclick="verifyOTP()">Register</button>

    <div class="auth-footer">
        Already have an account?
        <a href="login.html">Login</a>
    </div>
</div>

<script>

async function sendOTP(){

    const email = document.getElementById("email").value;

    if(!email){
        alert("Enter Email first ❌");
        return;
    }

    const res = await fetch("http://localhost:5000/send-otp",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email })
    });

    const data = await res.json();
    alert(data.message);
}


async function verifyOTP(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const otp = document.getElementById("otp").value;
    const gender = document.getElementById("gender").value;
    const address = document.getElementById("address").value;

    if(!email || !password || !otp || !gender || !address){
        alert("Fill all fields ❌");
        return;
    }

    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;

    const res = await fetch("http://localhost:5000/verify-otp",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ firstName, lastName, email, password, otp, gender, address })
    });

    const data = await res.json();

    if(data.success){
        alert("Registered Successfully ✅");
        window.location.href="login.html";
    }else{
        alert(data.message);
    }
}

</script>

</body>
</html>
