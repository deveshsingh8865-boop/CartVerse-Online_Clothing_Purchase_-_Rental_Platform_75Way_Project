<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment - Cart-Verse</title>

<style>
body{
    font-family: Arial;
    background:#f1f3f6;
    text-align:center;
}

.container{
    width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

.payment-option{
    margin:15px 0;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    cursor:pointer;
}

.payment-option:hover{
    background:#f9f9f9;
}

button{
    margin-top:20px;
    padding:12px;
    width:100%;
    border:none;
    background:#fb641b;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#d95413;
}

/* ===========================
   Payment Page CSS
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

.container h2{
    margin-bottom:10px;
    color:#222;
}

#totalAmount{
    font-size:20px;
    font-weight:bold;
    color:#ff6600;
    margin-bottom:25px;
}

/* Payment Options */

.payment-option{
    width:100%;
    border:2px solid #ddd;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    transition:.3s;
}

.payment-option:hover{
    background:#f5f5f5;
    border-color:#673ab7;
    transform:scale(1.02);
}

.payment-option.active{
    background:#ede7f6;
    border-color:#673ab7;
}

/* QR Section */

.qr{
    display:none;
    margin-top:25px;
    animation:fade .5s;
}

.qr h3{
    margin-bottom:15px;
    color:#444;
}

.qr img{
    width:240px;
    height:240px;
    border-radius:10px;
    border:5px solid #eee;
    padding:8px;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.qr p{
    margin-top:15px;
    color:#555;
    font-size:15px;
}

/* Buttons */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    margin-top:18px;
    transition:.3s;
}

.confirm-btn{
    background:#fb641b;
    color:white;
}

.confirm-btn:hover{
    background:#d95413;
}

.home-btn{
    background:#222;
    color:white;
}

.home-btn:hover{
    background:#444;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* Responsive */

@media(max-width:500px){

.container{

    width:95%;
    padding:20px;

}

.qr img{

    width:200px;
    height:200px;

}

}
</style>
</head>

<body>

<div class="container">
    <h2>Select Payment Method</h2>
    <h3 id="totalAmount"></h3>

    <!-- Cash -->
    <div class="payment-option" onclick="selectPayment('cash')">
        💵 Cash on Delivery
    </div>

    <!-- QR -->
    <div class="payment-option" onclick="selectPayment('qr')">
        📱 Pay via QR Code
    </div>

    <!-- QR Image -->
    <div class="qr" id="qrBox">
        <h3>Scan & Pay</h3>
        <img src="WhatsApp Image 2026-07-05 at 2.21.51 PM.jpeg">
        <p>Scan this QR using PhonePe / GPay / Paytm</p>
    </div>

    <button onclick="confirmPayment()">Confirm Payment</button>
</div>

<script>

let method = "";

/* ===== PAYMENT SELECT ===== */
function selectPayment(type){
    method = type;

    if(type === "qr"){
        document.getElementById("qrBox").style.display = "block";
    }else{
        document.getElementById("qrBox").style.display = "none";
    }
}

/* ===== CONFIRM PAYMENT ===== */
async function confirmPayment(){

    const token = localStorage.getItem("token");
    const orderId = localStorage.getItem("pendingOrderId");

    if(!token){
        alert("Please login first!");
        window.location.href = "login.html";
        return;
    }

    if(method === ""){
        alert("Please select payment method");
        return;
    }

    if(!orderId){
        alert("No active booking found. Please book again.");
        window.location.href = "oindex.html";
        return;
    }

    try {
        const res = await fetch("http://localhost:5000/api/payment/confirm", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                orderId,
                paymentMethod: method
            })
        });

        const data = await res.json();

        if(!data.success){
            alert(data.message || "Payment failed");
            return;
        }

        if(method === "cash"){
            alert("Order placed with Cash on Delivery 💵");
        }

        if(method === "qr"){
            alert("Payment successful via QR ✅");
        }

        localStorage.removeItem("cart");
        localStorage.removeItem("pendingOrderId");
        localStorage.removeItem("pendingOrderTotal");
        window.location.href = "oindex.html";
    } catch (error) {
        console.error(error);
        alert("Payment confirmation failed. Please try again.");
    }
}

/* ===== TOTAL AMOUNT SHOW ===== */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = Number(localStorage.getItem("pendingOrderTotal") || 0);

if (total === 0) {
    cart.forEach(item => {
        total += item.price * item.days;
    });
}

document.getElementById("totalAmount").innerText =
    "Total Amount: ₹" + total;

</script>



</body>
</html>
